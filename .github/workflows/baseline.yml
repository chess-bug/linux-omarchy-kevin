# R-14 baseline: build the UNCHANGED upstream linux-omarchy-aarch64 on the free
# GitHub arm64 runner and record time, RAM and disk. Our own work; no Kevin
# changes. Why: KEVIN-R14-RUNNER-OPTIONS.md (disk/time of the free runner are
# upstream claims, not our measurement). Copy to .github/workflows/ of a
# separate public repository; nothing here needs secrets.
name: R-14 upstream kernel baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      TOOLS_COMMIT: 949b8dc8097c64cd8d8325082809e07cffefbc61
      PACKAGE: linux-omarchy-aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-pkgs
          ref: ${{ env.TOOLS_COMMIT }}
          path: tools
          persist-credentials: false

      - name: Record runner
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          { date -u +%FT%TZ; uname -a; nproc; lscpu; free -m; df -Pk;
            lsblk; docker info; } > "$RUNNER_TEMP/baseline/runner.txt" 2>&1
          cat "$RUNNER_TEMP/baseline/runner.txt"

      - name: Build upstream kernel (unchanged)
        timeout-minutes: 330
        working-directory: tools
        run: |
          set -o pipefail
          ( while true; do date -u +%FT%TZ; free -m; df -Pk / "$RUNNER_TEMP";
              sleep 30; done ) > "$RUNNER_TEMP/baseline/resources.log" 2>&1 &
          echo "start $(date -u +%FT%TZ)" > "$RUNNER_TEMP/baseline/timing.txt"
          CONTAINER_ENGINE=docker bin/build --mirror stable --arch aarch64 \
            --package "$PACKAGE" 2>&1 | tee "$RUNNER_TEMP/baseline/build.log"
          echo "end $(date -u +%FT%TZ)" >> "$RUNNER_TEMP/baseline/timing.txt"

      - name: Summarize
        if: always()
        run: |
          echo "end-or-stop $(date -u +%FT%TZ)" >> "$RUNNER_TEMP/baseline/timing.txt"
          { df -Pk; docker system df; ls -l tools/build-output/stable/aarch64; } \
            > "$RUNNER_TEMP/baseline/final.txt" 2>&1 || true
          grep ' /$' "$RUNNER_TEMP/baseline/resources.log" | sort -k3 -n | tail -1 \
            > "$RUNNER_TEMP/baseline/peak-root-used.txt" || true
          cat "$RUNNER_TEMP/baseline/timing.txt" "$RUNNER_TEMP/baseline/final.txt" "$RUNNER_TEMP/baseline/peak-root-used.txt"

      # Logs only (packages ~200 MB are not needed for the baseline).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: r14-upstream-kernel-baseline-${{ github.run_id }}
          retention-days: 7
          path: ${{ runner.temp }}/baseline
